# Uncomment the following line to enable deep sleep
#CONFIG_ZMK_SLEEP=n
CONFIG_BT_BAS=y
CONFIG_ZMK_IDLE_TIMEOUT=300000

# nice!view 미장착 상태이므로 디스플레이 비활성화.
# nice_view.conf 의 CONFIG_ZMK_DISPLAY=y 를 덮어써서 src/display/main.c 자체를 뺀다.
# (이게 없으면 패널이 없어도 10ms 주기 LVGL 틱 타이머가 초당 100회 CPU 를 깨운다)
# 실제로 nice!view 를 장착하면 이 줄만 지우면 된다.
CONFIG_ZMK_DISPLAY=n

# 배터리 레벨 보고 주기(초). 기본 60 -> 600
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600


# Uncomment the following line to increase the keyboard's wireless range
# 0dBm(Zephyr 기본값)으로 절전 실험 중. 사용 중 오른손 키 씹힘이나 연결 끊김이 생기면
# 먼저 PLUS_4 로 한 단계만 복구할 것. PLUS_8 은 왼쪽(central)이 7.5ms 마다 송신하므로
# 왼쪽 반쪽에만 약 0.1mA 를 추가로 소모한다.
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Enable ZMK Studio for Realtime Keymap Updates
#CONFIG_ZMK_STUDIO=y
#CONFIG_ZMK_STUDIO_LOCKING=n

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y

# Enable mouse key
CONFIG_ZMK_POINTING=y
